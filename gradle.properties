# 基准环境为 GitHub Actions 公共仓库 runner：4 vCPU / 16 GB RAM / 14 GB SSD。
# 16GB 下 daemon 堆给 4096m，容纳 in-process Kotlin 编译与 R8 三 flavor 峰值。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Kotlin 编译改 in-process：跑进 Gradle daemon，省掉独立的 Kotlin daemon JVM（再省一份内存）。
# 官方推荐策略之一，详见 kotlin.compiler.execution.strategy。
kotlin.compiler.execution.strategy=in-process

# 对齐 runner 的 4 vCPU；不设更高是因为 R8 三 flavor 同时压缩资源时内存会顶到 16GB 上限。
org.gradle.workers.max=4

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# 配置缓存：缓存命中时直接跳过整个配置阶段（脚本编译 + 插件初始化与 task 图构建）。
# problems=warn 让不兼容项只告警不中断构建。
# 注意属性名：叫 configuration-cache（不是 configure-cache），写错不会报错而是默默失效。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.enableJetifier=true

android.suppressUnsupportedCompileSdk=37
